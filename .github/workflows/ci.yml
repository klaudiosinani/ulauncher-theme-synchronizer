name: CI

on:
    push:
        branches: [ main ]
        tags: [ 'v*' ]
    pull_request:
        branches: [ main ]
        paths-ignore:
            - "*.md"
            - "docs/**"
            - "media/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    ci:
        name: Tests & Checks
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                python-version: [ '3.12', '3.13' ]
                os: [ ubuntu-latest ]
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup Python ${{ matrix.python-version }}
                uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                    cache-dependency-path: requirements-dev.txt

            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements-dev.txt

            -   name: Lint
                run: ruff check .

            -   name: Format check
                run: ruff format --check .

            -   name: Run tests with coverage
                if: matrix.python-version == '3.12'
                run: pytest --cov --cov-report=xml --cov-report=term-missing

            -   name: Run tests
                if: matrix.python-version != '3.12'
                run: pytest

            -   name: Upload coverage artifact
                if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
                uses: actions/upload-artifact@v5
                with:
                    name: coverage-report
                    path: coverage.xml

    extension:
        name: Extension Manifest
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Validate manifest.json
                run: |
                    jq --exit-status 'type == "object"' manifest.json > /dev/null

                    for key in required_api_version name description developer_name icon preferences; do
                      jq --exit-status --arg key "$key" 'has($key)' manifest.json > /dev/null \
                        || { echo "manifest.json is missing the '$key' key"; exit 1; }
                    done

                    ICON=$(jq --raw-output '.icon' manifest.json)
                    test -f "$ICON" || { echo "manifest.json icon '$ICON' does not exist"; exit 1; }

                    echo "manifest.json is valid"

            -   name: Validate versions.json
                run: |
                    jq --exit-status 'type == "array" and length > 0' versions.json > /dev/null \
                      || { echo "versions.json must be a non-empty array"; exit 1; }

                    jq --exit-status 'all(has("required_api_version") and has("commit"))' versions.json > /dev/null \
                      || { echo "every versions.json entry needs required_api_version and commit"; exit 1; }

                    echo "versions.json is valid"

            -   name: Verify preference identifiers match the Theme enum
                run: |
                    THEME_VALUES=$(python3 -c "
                    from src.feature.synchronization.theme.theme import Theme

                    for theme in Theme:
                        print(theme.value)
                    ")

                    test -n "$THEME_VALUES" || { echo "the Theme enum declares no values"; exit 1; }

                    while IFS= read -r value; do
                      jq --exit-status --arg id "$value" \
                        'any(.preferences[]; .id == $id)' manifest.json > /dev/null \
                        || { echo "manifest.json declares no preference with the id '$value'"; exit 1; }

                      echo "Theme value '$value' is declared in manifest.json"
                    done <<< "$THEME_VALUES"

                    echo "manifest preferences match the Theme enum"

    quality-scan:
        name: Code Quality Analysis
        runs-on: ubuntu-latest
        needs: [ ci, extension ]
        if: ${{ always() && needs.ci.result == 'success' }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Download coverage artifact
                uses: actions/download-artifact@v6
                with:
                    name: coverage-report

            -   name: Verify coverage output
                run: |
                    if [ ! -f coverage.xml ]; then
                      echo "❌ ERROR: coverage.xml not found"
                      exit 1
                    fi
                    echo "✅ Coverage output found"
                    head -20 coverage.xml

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v5
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: ./coverage.xml
                    flags: unittests
                    name: codecov-coverage

            -   name: SonarQube Scan
                uses: SonarSource/sonarqube-scan-action@master
                env:
                    SONAR_HOST_URL: https://sonarcloud.io
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                    args: >
                        -Dsonar.projectKey=klaudiosinani_ulauncher-theme-synchronizer
                        -Dsonar.organization=klaudiosinani
                        -Dsonar.sources=src
                        -Dsonar.tests=tests
                        -Dsonar.python.version=3.12
                        -Dsonar.python.coverage.reportPaths=coverage.xml
                        -Dsonar.coverage.exclusions=tests/**,tasks.py
                        -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
